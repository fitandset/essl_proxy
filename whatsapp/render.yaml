services:
  - type: web
    name: bailey-whatsapp
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_ID
        value: default
      - key: ANTIBAN_MAX_PER_DAY
        value: "30"
      - key: LOG_LEVEL
        value: warn
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
